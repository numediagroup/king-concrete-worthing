# Static site — no build step. Netlify serves the repo root as-is.
[build]
  publish = "."

# Long-cache the self-hosted fonts (they are content-hashed by filename anyway)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
